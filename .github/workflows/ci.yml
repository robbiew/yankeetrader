name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Go tests, evidence and terminal smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: yankeetrader
    steps:
      - name: Check out Yankee Trader
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: yankeetrader
          persist-credentials: false
      - name: Check out minimum supported GoDoors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: robbiew/godoors
          ref: 2bb91d527ae926b436a5a65eb380441eb937e6a9
          path: godoors
          persist-credentials: false
      - name: Set up minimum supported Go version
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: yankeetrader/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Run race-enabled tests and vet
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Exercise season administration CLI
        run: |
          python3 scripts/smoke_season_admin.py
          python3 scripts/smoke_port_generation.py
          python3 scripts/smoke_warp_generation.py
          python3 scripts/smoke_qb_profile.py
      - name: Verify preserved research evidence
