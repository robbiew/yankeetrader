name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Go tests, evidence and terminal smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: yankeetrader
    steps:
      - name: Check out Yankee Trader
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: yankeetrader
          persist-credentials: false
      - name: Check out minimum supported GoDoors
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: robbiew/godoors
          ref: 9364a49ddd7c396ccbfcdd3c240c104ea9178551
          path: godoors
          persist-credentials: false
      - name: Set up minimum supported Go version
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: yankeetrader/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Run race-enabled tests and vet
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Verify preserved research evidence
        run: |
          python3 scripts/verify_startup_evidence.py
          python3 scripts/verify_port_screens.py
          python3 scripts/verify_planet_screens.py
          python3 scripts/verify_planet_rename.py
          python3 scripts/verify_navigation_evidence.py
          python3 scripts/verify_utility_evidence.py
          python3 scripts/verify_bribes.py
          python3 scripts/verify_bribe_hostility.py
          python3 scripts/verify_mercenary_maintenance.py
          python3 scripts/verify_xannor_lifecycle.py
          python3 scripts/verify_xannor_mobile.py
          python3 scripts/test_xannor_mobile_verifier.py
          python3 scripts/verify_xannor_ships.py
          python3 scripts/test_xannor_ships_verifier.py
          python3 scripts/verify_xannor_planets.py
          python3 scripts/test_xannor_planets_verifier.py
          python3 scripts/verify_xannor_revenge.py
          python3 scripts/test_xannor_revenge_verifier.py
          python3 scripts/verify_xannor_hq_reward.py
          python3 scripts/test_xannor_hq_reward_verifier.py
          python3 scripts/verify_scanner_manual_warp.py
          python3 scripts/test_scanner_manual_warp_verifier.py
          python3 scripts/verify_genesis_reset.py
          python3 scripts/test_genesis_reset_verifier.py
          python3 scripts/verify_wanderer.py
          python3 scripts/test_wanderer_verifier.py
          python3 scripts/verify_plasma.py
          python3 scripts/test_plasma_verifier.py
          python3 scripts/verify_mercenary_plasma.py
          python3 scripts/test_mercenary_plasma_verifier.py
          python3 scripts/verify_disruption.py
          python3 scripts/test_disruption_verifier.py
          python3 scripts/verify_planet_mobility.py
          python3 scripts/test_planet_mobility_verifier.py
          python3 scripts/verify_earth_lottery.py
          python3 scripts/test_earth_lottery_verifier.py
          python3 scripts/verify_cloak_equipment.py
          python3 scripts/test_cloak_equipment_verifier.py
          python3 scripts/verify_maintenance_lottery.py
          python3 scripts/test_maintenance_lottery_verifier.py
          python3 scripts/verify_plague_civil_war.py
          python3 scripts/test_plague_civil_war_verifier.py
          python3 scripts/verify_rankings.py
          python3 scripts/verify_spies.py
          python3 scripts/verify_spy_intelligence.py
          python3 scripts/test_spy_intelligence_verifier.py
          python3 scripts/verify_newspaper.py
          python3 scripts/verify_commerce_evidence.py
          python3 scripts/verify_team_radio.py
          python3 scripts/verify_broadcast_lifetime.py
          python3 scripts/test_broadcast_lifetime_verifier.py
          python3 scripts/test_team_radio_verifier.py
          python3 scripts/verify_avoid_evidence.py
          python3 scripts/verify_planet_evidence.py
          python3 scripts/verify_salvage_model.py
          python3 scripts/verify_mine_model.py
          python3 scripts/verify_mine_placement.py
          python3 scripts/verify_missile_model.py
          python3 scripts/verify_planet_missile_model.py
          python3 scripts/verify_production_evidence.py
          python3 scripts/verify_missile_evidence.py
          python3 scripts/verify_hazard_evidence.py
          python3 scripts/verify_loot_evidence.py
          python3 scripts/verify_ship_duel_model.py
          python3 scripts/verify_sector_model.py
          python3 scripts/verify_team_evidence.py
          python3 scripts/verify_ownership_evidence.py
          python3 scripts/verify_archive.py
      - name: Build and exercise real terminal sessions
        run: |
          go build -o bin/yt ./cmd/yt
          python3 scripts/smoke_startup.py
          python3 scripts/smoke_prompt_clock.py
          python3 scripts/smoke_ports.py
          python3 scripts/smoke_ports.py --ascii
          python3 scripts/smoke_port_parity.py
          python3 scripts/smoke_planet_parity.py
          python3 scripts/smoke_planet_parity.py --ascii
          python3 scripts/smoke_planet_rename.py
          python3 scripts/smoke_planet_rename.py --ascii
          python3 scripts/smoke_navigation.py
          python3 scripts/smoke_automatic_scores.py
          python3 scripts/smoke_rankings.py
          python3 scripts/smoke_radio.py
          python3 scripts/smoke_team_radio.py
          python3 scripts/smoke_spies.py
          python3 -m unittest discover -s scripts -p test_smoke_newspaper.py
          python3 scripts/smoke_newspaper.py
          python3 scripts/smoke_maintenance_awards.py
          python3 scripts/smoke_overcrowding.py
          python3 scripts/smoke_reports.py
          python3 scripts/smoke_trade_reports.py
          python3 scripts/smoke.py
          python3 scripts/smoke_ownership.py
          python3 scripts/smoke_teams.py
          python3 scripts/smoke_lifecycle.py
          python3 scripts/smoke_salvage.py
          python3 scripts/smoke_cloak.py
          python3 scripts/smoke_attacks.py
          python3 scripts/smoke_mines.py
          python3 scripts/smoke_missiles.py
          python3 scripts/smoke_sector_fighters.py
          python3 scripts/smoke_bribes.py
          python3 scripts/smoke_mercenary_hiring.py
          python3 scripts/smoke_mercenary_routes.py
          python3 scripts/smoke_mercenary_desertion.py
          python3 scripts/smoke_mercenary_base.py
          python3 scripts/smoke_xannor_lifecycle.py
          python3 scripts/smoke_xannor_mobile.py
          python3 scripts/smoke_xannor_ships.py
          python3 scripts/smoke_xannor_planets.py
          python3 scripts/smoke_xannor_revenge.py
          python3 scripts/smoke_xannor_hq_rewards.py
          python3 scripts/smoke_scanner_warp.py
          python3 scripts/smoke_earth_lottery.py
          python3 scripts/smoke_planet_mobility.py
          python3 scripts/smoke_wanderer.py
          python3 scripts/smoke_plasma.py
          python3 scripts/smoke_disruption.py
          python3 scripts/test_smoke_arrival_control.py
          python3 scripts/smoke_genesis.py
          python3 scripts/smoke_cloak_equipment.py
          python3 scripts/smoke_planet_missiles.py
      - name: Cross-build Linux and Windows
        run: |
          mkdir -p ../artifacts
          GOOS=linux GOARCH=amd64 go build -o ../artifacts/yt-linux ./cmd/yt
          GOOS=windows GOARCH=amd64 go build -o ../artifacts/yt-windows.exe ./cmd/yt
